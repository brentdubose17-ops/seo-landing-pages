<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="InferenceX benchmark: Jalapeño vs Nvidia Blackwell work per watt and latency by model">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="60" y="52" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">InferenceX benchmark — Jalapeño vs Nvidia Blackwell</text>
  <text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Multiples reported by OpenAI, Aug 25 2026 (self-reported, vendor-controlled comparison systems)</text>

  <g transform="translate(60, 120)">
    <line x1="0" y1="400" x2="1020" y2="400" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="300" x2="1020" y2="300" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="200" x2="1020" y2="200" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="100" x2="1020" y2="100" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="0" x2="1020" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="-8" y="406" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">0×</text>
    <text x="-8" y="106" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">3×</text>
    <text x="-8" y="6" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">4×</text>

    <g transform="translate(120, 0)">
      <rect x="20" y="294" width="120" height="106" rx="6" fill="#22c55e"/>
      <text x="80" y="284" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d">1.9×</text>
      <rect x="170" y="230" width="120" height="170" rx="6" fill="#60a5fa"/>
      <text x="230" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb">1.7×</text>
      <text x="155" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">GPT-OSS 120B</text>
    </g>
    <g transform="translate(430, 0)">
      <rect x="20" y="306" width="120" height="94" rx="6" fill="#22c55e"/>
      <text x="80" y="296" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d">1.7×</text>
      <rect x="170" y="10" width="120" height="390" rx="6" fill="#60a5fa"/>
      <text x="230" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb">3.6×</text>
      <text x="155" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">DeepSeek R1 670B</text>
    </g>
    <g transform="translate(740, 0)">
      <rect x="20" y="320" width="120" height="80" rx="6" fill="#22c55e"/>
      <text x="80" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#15803d">1.5×</text>
      <rect x="170" y="24" width="120" height="376" rx="6" fill="#60a5fa"/>
      <text x="230" y="14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb">3.4×</text>
      <text x="155" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kimi K2.5 1T</text>
    </g>
  </g>

  <g transform="translate(60, 575)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="#22c55e"/>
    <text x="36" y="20" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">Work per watt (peak, × vs Blackwell)</text>
    <rect x="330" y="0" width="26" height="26" rx="4" fill="#60a5fa"/>
    <text x="366" y="20" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a">End-to-end latency (× lower)</text>
  </g>
  <text x="60" y="618" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">Source: OpenAI, InferenceX (SemiAnalysis), Aug 25, 2026 — self-reported measurements on OpenAI-controlled systems.</text>
</svg>
