<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="OpenAI Jalapeño inference chip first results show 1.5-1.9x more AI work per watt than Nvidia Blackwell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1a2c4a"/>
    </linearGradient>
    <linearGradient id="chipgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <circle cx="330" cy="315" r="270" fill="url(#glow)"/>
  <g transform="translate(180,165)">
    <rect x="0" y="0" width="300" height="300" rx="28" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <g fill="#22c55e">
      <rect x="20" y="28" width="14" height="34" rx="3"/><rect x="60" y="28" width="14" height="34" rx="3"/>
      <rect x="100" y="28" width="14" height="34" rx="3"/><rect x="140" y="28" width="14" height="34" rx="3"/>
      <rect x="180" y="28" width="14" height="34" rx="3"/><rect x="220" y="28" width="14" height="34" rx="3"/>
      <rect x="260" y="28" width="14" height="34" rx="3"/>
      <rect x="20" y="238" width="14" height="34" rx="3"/><rect x="60" y="238" width="14" height="34" rx="3"/>
      <rect x="100" y="238" width="14" height="34" rx="3"/><rect x="140" y="238" width="14" height="34" rx="3"/>
      <rect x="180" y="238" width="14" height="34" rx="3"/><rect x="220" y="238" width="14" height="34" rx="3"/>
      <rect x="260" y="238" width="14" height="34" rx="3"/>
      <rect x="28" y="20" width="34" height="14" rx="3"/><rect x="238" y="20" width="34" height="14" rx="3"/>
      <rect x="28" y="60" width="34" height="14" rx="3"/><rect x="238" y="60" width="34" height="14" rx="3"/>
      <rect x="28" y="100" width="34" height="14" rx="3"/><rect x="238" y="100" width="34" height="14" rx="3"/>
      <rect x="28" y="140" width="34" height="14" rx="3"/><rect x="238" y="140" width="34" height="14" rx="3"/>
      <rect x="28" y="180" width="34" height="14" rx="3"/><rect x="238" y="180" width="34" height="14" rx="3"/>
      <rect x="28" y="220" width="34" height="14" rx="3"/><rect x="238" y="220" width="34" height="14" rx="3"/>
      <rect x="28" y="260" width="34" height="14" rx="3"/><rect x="238" y="260" width="34" height="14" rx="3"/>
    </g>
    <rect x="58" y="58" width="184" height="184" rx="16" fill="url(#chipgrad)" opacity="0.92"/>
    <rect x="86" y="86" width="128" height="128" rx="10" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <text x="150" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ade80">JALAPEÑO</text>
    <text x="150" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#86efac">GPT-OSS · R1 · K2.5</text>
    <circle cx="120" cy="196" r="7" fill="none" stroke="#4ade80" stroke-width="2"/>
    <circle cx="150" cy="196" r="7" fill="none" stroke="#4ade80" stroke-width="2"/>
    <circle cx="180" cy="196" r="7" fill="none" stroke="#4ade80" stroke-width="2"/>
  </g>
  <text x="560" y="150" font-family="Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">OpenAI <tspan fill="#4ade80">Jalapeño</tspan></text>
  <text x="560" y="192" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Custom inference ASIC · co-built with Broadcom</text>
  <text x="560" y="232" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">First results: Hot Chips, Aug 25, 2026</text>
  <g transform="translate(560, 300)">
    <rect x="0" y="0" width="520" height="150" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#334155" stroke-width="1.5"/>
    <text x="26" y="38" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e2e8f0">InferenceX benchmark vs Nvidia Blackwell</text>
    <text x="26" y="76" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#4ade80">1.5–1.9×</text>
    <text x="150" y="76" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">more AI work per watt</text>
    <text x="26" y="116" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#60a5fa">1.7–3.6×</text>
    <text x="150" y="116" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">lower end-to-end latency</text>
  </g>
  <text x="560" y="505" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Self-reported measurements · deploy in very small volumes by end of 2026, ramp 2027</text>
  <text x="560" y="560" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">What falling AI inference costs mean for agency pricing — aiagencycalculator.com</text>
</svg>
