<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Perplexity Portable Computer on NVIDIA DGX Spark: local AI agents with $0 per-token local steps versus cloud API billing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b33"/>
      <stop offset="1" stop-color="#1a2c4a"/>
    </linearGradient>
    <linearGradient id="boxgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0f1d33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/><line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/><line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
  </g>
  <circle cx="600" cy="300" r="280" fill="url(#glow)"/>
  <!-- desktop AI box -->
  <g transform="translate(470 180)">
    <rect x="0" y="0" width="260" height="170" rx="14" fill="url(#boxgrad)" stroke="#2c4a76" stroke-width="2"/>
    <rect x="18" y="18" width="224" height="96" rx="8" fill="#0a1424" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="34" y="34" width="100" height="10" rx="5" fill="#22c55e" opacity="0.85"/>
    <rect x="34" y="56" width="150" height="8" rx="4" fill="#3b5b8a" opacity="0.7"/>
    <rect x="34" y="74" width="120" height="8" rx="4" fill="#3b5b8a" opacity="0.5"/>
    <circle cx="196" cy="40" r="14" fill="url(#accent)" opacity="0.9"/>
    <circle cx="196" cy="40" r="5" fill="#0b1220"/>
    <g stroke="#22c55e" stroke-width="2" fill="none" opacity="0.9">
      <rect x="18" y="130" width="70" height="24" rx="5" stroke="#22c55e" opacity="0.55"/>
      <rect x="96" y="130" width="70" height="24" rx="5" stroke="#22c55e" opacity="0.55"/>
      <rect x="174" y="130" width="70" height="24" rx="5" stroke="#22c55e" opacity="0.55"/>
      <circle cx="53" cy="142" r="4" fill="#22c55e" stroke="none"/>
      <circle cx="131" cy="142" r="4" fill="#22c55e" stroke="none"/>
      <circle cx="209" cy="142" r="4" fill="#22c55e" stroke="none"/>
    </g>
  </g>
  <!-- price tags -->
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="210" fill="#22c55e" font-size="30" font-weight="bold">$0 / token</text>
    <text x="80" y="240" fill="#9db4d6" font-size="22">local agent steps</text>
    <text x="940" y="210" fill="#f87171" font-size="30" font-weight="bold">$5-$25 / MTok</text>
    <text x="940" y="240" fill="#9db4d6" font-size="22">cloud API billing</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="600" y="470" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="bold">Local AI Agents on Your Own Hardware</text>
    <text x="600" y="510" text-anchor="middle" fill="#9db4d6" font-size="26">Perplexity Portable Computer on NVIDIA DGX Spark &#8212; the cost math for agencies</text>
    <text x="600" y="558" text-anchor="middle" fill="#22c55e" font-size="20">DGX Spark &#183; RTX builds &#183; 50M-token break-even &#183; hybrid escalation</text>
  </g>
</svg>
