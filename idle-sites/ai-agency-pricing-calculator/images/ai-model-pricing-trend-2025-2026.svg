<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AI model pricing trend 2025–2026: cost per million tokens for GPT, Claude, Gemini, DeepSeek">
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="60" y="46" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">AI model pricing trend — input $ per 1M tokens</text>
  <text x="60" y="76" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#64748b">Jan 2025 – Aug 2026 (log scale). OpenAI has cut the same flagship family twice in one month.</text>

  <g transform="translate(60, 100)">
    <line x1="0" y1="380" x2="800" y2="380" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="224" x2="800" y2="224" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#e2e8f0" stroke-width="1"/>
    <text x="-8" y="385" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">$0.20</text>
    <text x="-8" y="229" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">$1</text>
    <text x="-8" y="5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">$10</text>

    <!-- DeepSeek R1 Jan 2025 -->
    <circle cx="40" cy="282" r="8" fill="#7c3aed"/>
    <text x="40" y="262" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">$0.55</text>
    <text x="40" y="306" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">DeepSeek R1</text>

    <!-- GPT-5 Aug 2025 -->
    <circle cx="150" cy="202" r="8" fill="#2563eb"/>
    <text x="150" y="182" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">$1.25</text>
    <text x="150" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">GPT-5</text>

    <!-- Terra Jul 9 2026 -->
    <circle cx="260" cy="135" r="8" fill="#2563eb"/>
    <text x="260" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">$2.50</text>
    <text x="260" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Terra (GA)</text>

    <!-- Opus 5 Jul 24 2026 -->
    <circle cx="330" cy="67" r="8" fill="#d97706"/>
    <text x="330" y="47" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706">$5.00</text>
    <text x="330" y="91" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Claude Opus 5</text>

    <!-- Terra cut Jul 30 -->
    <circle cx="400" cy="156" r="8" fill="#2563eb"/>
    <text x="400" y="136" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">$2.00</text>
    <line x1="260" y1="135" x2="400" y2="156" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="330" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb">−20% Jul 30</text>
    <circle cx="415" cy="380" r="7" fill="#93c5fd"/>
    <text x="415" y="402" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb">Luna $0.20 (−80%)</text>

    <!-- Sol cut Aug 21: pre-promo $5 -> $4 -->
    <circle cx="445" cy="67" r="7" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="470" cy="89" r="8" fill="#2563eb"/>
    <text x="470" y="69" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">$4.00</text>
    <line x1="445" y1="67" x2="470" y2="89" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="470" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb">Sol −20% Aug 21</text>
    <text x="445" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">list $5</text>

    <!-- Fable 5 Aug 2026 -->
    <circle cx="540" cy="0" r="8" fill="#d97706"/>
    <text x="540" y="22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#d97706">$10.00</text>
    <text x="540" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Claude Fable 5</text>

    <!-- DeepSeek V3.2 Aug 2026 -->
    <circle cx="610" cy="347" r="8" fill="#7c3aed"/>
    <text x="610" y="327" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">$0.28</text>
    <text x="610" y="371" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">DeepSeek V3.2</text>

    <!-- Gemini 3.7 Flash intro 2026 -->
    <circle cx="680" cy="252" r="8" fill="#16a34a"/>
    <text x="680" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a">$0.75</text>
    <text x="680" y="276" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#334155">Gemini 3.7 Flash (intro)</text>

    <!-- Gemini reversion Jan 1 2027 -->
    <circle cx="780" cy="184" r="8" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    <text x="780" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a">$1.50</text>
    <line x1="680" y1="252" x2="780" y2="184" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="730" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a">×2 Jan 1 '27</text>
    <text x="780" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">reverts</text>

    <!-- X axis labels -->
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      <text x="40" y="420">Jan 20 '25</text>
      <text x="150" y="420">Aug 7 '25</text>
      <text x="260" y="420">Jul 9 '26</text>
      <text x="330" y="420">Jul 24 '26</text>
      <text x="400" y="420">Jul 30 '26</text>
      <text x="470" y="420">Aug 21 '26</text>
      <text x="540" y="420">Aug '26</text>
      <text x="610" y="420">Aug '26</text>
      <text x="680" y="420">2026</text>
      <text x="780" y="420">Jan 1 '27</text>
    </g>
  </g>

  <g transform="translate(60, 545)">
    <circle cx="10" cy="10" r="8" fill="#2563eb"/><text x="26" y="15" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">OpenAI</text>
    <circle cx="120" cy="10" r="8" fill="#d97706"/><text x="136" y="15" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Anthropic</text>
    <circle cx="240" cy="10" r="8" fill="#16a34a"/><text x="256" y="15" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">Google</text>
    <circle cx="340" cy="10" r="8" fill="#7c3aed"/><text x="356" y="15" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">DeepSeek</text>
    <circle cx="450" cy="10" r="8" fill="none" stroke="#2563eb" stroke-width="2.5"/><text x="466" y="15" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#0f172a">= promo / reversion</text>
  </g>
  <text x="60" y="605" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">List rates, input $ per 1M tokens. Sources: CloudZero, PricePerToken, Google (verified Aug 2026). Sol promo thru ≥Nov 21, 2026; Gemini intro reverts Jan 1, 2027.</text>
</svg>
